<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>examoverflow</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --primary: #90caf9;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border: #383838;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
    }
    .title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .stats-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-val { font-weight: 700; color: var(--primary); }
    .btn-launch {
      width: 100%;
      background-color: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .btn-launch:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon_48.png" alt="examoverflow" class="logo">
    <div class="title">examoverflow</div>
  </div>

  <div class="stats-card">
    <div class="stat-row">
      <span style="color: var(--text-muted);">Tests Completed:</span>
      <span class="stat-val" id="popTestsCount">0</span>
    </div>
    <div class="stat-row">
      <span style="color: var(--text-muted);">Overall Accuracy:</span>
      <span class="stat-val" id="popAccuracy">0%</span>
    </div>
    <div class="stat-row">
      <span style="color: var(--text-muted);">Available Tests:</span>
      <span class="stat-val">1,809</span>
    </div>
  </div>

  <button class="btn-launch" id="btnLaunchPortal">
    🚀 Launch examoverflow
  </button>

  <script src="src/popup.js"></script>
</body>
</html>
